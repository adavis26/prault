name: Publish npm

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    # TEMPORARY: Allow pushes to main during alpha development
    # if: github.event_name == 'release'
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      id-token: write  # npm trusted publishing OIDC token

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download npm build artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm/

      - name: Install dependencies
        run: cd npm && npm ci

      - name: Publish to npm
        run: cd npm && npm publish --provenance --access public