name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deno-version: [ "2.x" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Check Deno version
        run: deno --version

      - name: Cache dependencies
        run: deno cache --lock=deno.lock deno.json

      - name: Run tests
        run: deno task test

  build-npm:
    name: Build npm package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: "2.x"

      - name: Cache dependencies
        run: deno cache --lock=deno.lock deno.json

      - name: Generate prompts
        run: deno task generate

      - name: Build npm package
        run: deno task build-npm

      - name: Upload npm build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm/
          retention-days: 30

  publish-jsr:
    name: Publish to JSR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: "2.x"

      - name: Cache dependencies
        run: deno cache --lock=deno.lock deno.json

      - name: Generate prompts
        run: deno task generate

      - name: Publish to JSR
        run: deno publish
        env:
          DENO_AUTH_TOKENS: ${{ secrets.DENO_AUTH_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-npm
    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download npm build artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm/

      - name: Install dependencies
        run: cd npm && npm ci

      - name: Publish to npm
        run: cd npm && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}